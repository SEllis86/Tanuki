[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanuki"
version = "5.0.0"
description = "Single-cell MALDI-MSI + optical microscopy pipeline: registration, Cellpose-SAM segmentation, per-cell features, embeddings, clustering, Bonsai, donor-level volcano plots, Dash viewer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "tifffile>=2023.7",
    "SimpleITK>=2.3",
    "matplotlib>=3.8",
    "Pillow>=10",
    "h5py>=3.9",
    "cellpose>=4.0",
    "pewlib>=0.10",
    "umap-learn>=0.5.5",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "plotly>=5.18,<6",
    "kaleido==0.2.1",
    "dash>=2.14",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tanuki = "tanuki.main:main"

[project.urls]
Repository = "https://github.com/SEllis86/Tanuki"

[tool.setuptools.packages.find]
where = ["src"]
